services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: chirpy
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - 5432:5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d chirpy"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    image: nindgabeet/chirpy:latest
    ports:
      - 8080:8080
    command: ["/usr/local/app/chirpy"]
    depends_on:
      db:
        condition: service_healthy
volumes:
  pgdata:
